name: Integration

# The round-trip tests need both stacks in one job, so they run inside the image
# built from docker/Dockerfile.integration rather than on the runner directly.
#
# The image is built here on every run, which costs a few minutes of
# BiocManager::install() even against binary repositories. It is cached through
# the GitHub Actions cache so that only a change to the Dockerfile or to
# pyproject.toml pays that cost; source-only changes reuse every layer. Once the
# image is published to a registry, replace the build step with a pull by digest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the two stacks drift independently: a new anndata or
    # pandas release can change the on-disk encoding without anything in this
    # repository changing. That is how the nullable-string-array incompatibility
    # asserted by `test_r_reads_default_string_encoding` would have surfaced
    # before it broke a round trip.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  roundtrip:
    name: mulink <-> QFeatures round trips
    runs-on: ubuntu-latest
    # A cold build installs R and Bioconductor packages before any test runs.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build the integration image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.integration
          load: true
          tags: ms-scverse-bioconductor:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the versions both legs are running
        run: |
          docker run --rm --entrypoint Rscript ms-scverse-bioconductor:integration \
            /app/R/roundtrip-cli.R check
          docker run --rm --entrypoint python ms-scverse-bioconductor:integration \
            -c "import importlib.metadata as m; print({p: m.version(p) for p in ('anndata', 'mudata', 'mulink', 'pandas')})"

      # Split from the round trips so that a failure here reads as "the
      # comparator is broken" rather than "the conversion is broken".
      - name: Comparator self-tests
        run: |
          docker run --rm ms-scverse-bioconductor:integration \
            tests/test_conformance.py -v --color=yes
          docker run --rm --entrypoint Rscript ms-scverse-bioconductor:integration \
            /app/R/roundtrip-cli.R selftest

      # `-m "not slow"` is a no-op today: the reference-data tier (ai2025a
      # through MsDataHub) is not implemented yet. The filter is here so that
      # adding it keeps it off the per-pull-request path by default.
      - name: Round trips
        run: |
          docker run --rm ms-scverse-bioconductor:integration \
            tests/integration -v --color=yes -m "not slow"
